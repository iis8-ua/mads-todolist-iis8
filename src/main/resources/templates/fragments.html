<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<nav th:fragment="menuAnonimo" class="navbar navbar-expand-lg navbar-light bg-light">

    <a class="navbar-brand" th:href="@{/about}">
        ToDoList
    </a>

    <div class="navbar-nav ml-auto">
        <a class="nav-item nav-link" th:href="@{/login}">
            Login
        </a>

        <a class="nav-item nav-link" th:href="@{/registro}">
            Registro
        </a>
    </div>

</nav>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light bg-light">

    <a class="navbar-brand" th:href="@{/about}">
        ToDoList
    </a>

    <div class="navbar-nav">
        <a class="nav-item nav-link"
           th:href="@{/usuarios/{id}/tareas(id=${usuario.id})}">
            Tareas
        </a>
    </div>

    <div class="navbar-nav ml-auto">
        <div class="nav-item dropdown">

            <a class="nav-link dropdown-toggle"
               href="#"
               id="usuarioDropdown"
               role="button"
               data-toggle="dropdown"
               aria-haspopup="true"
               aria-expanded="false"
               th:text="${usuario.nombre}">
                Usuario
            </a>

            <div class="dropdown-menu dropdown-menu-right"
                 aria-labelledby="usuarioDropdown">

                <a class="dropdown-item" th:href="@{/cuenta}">
                    Cuenta
                </a>

                <a class="dropdown-item"
                   th:href="@{/logout}"
                   th:text="'Cerrar sesión ' + ${usuario.nombre}">
                    Cerrar sesión
                </a>

            </div>
        </div>
    </div>

</nav>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

</html>
