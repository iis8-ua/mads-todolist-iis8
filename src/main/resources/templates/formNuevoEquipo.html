<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Nuevo equipo')"></head>

<body>
<div th:replace="fragments :: menu"></div>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Nuevo equipo</h2>
        </div>
    </div>

    <form method="post" th:action="@{/equipos/nueva}" th:object="${equipoData}">
        <div class="col-6">
            <div class="form-group">
                <label for="nombre">Nombre del equipo:</label>
                <input class="form-control" id="nombre" name="nombre" required
                       th:field="*{nombre}" type="text"/>
            </div>
            <button class="btn btn-primary" type="submit">Crear equipo</button>
            <a class="btn btn-link" th:href="@{/equipos}">Cancelar</a>
        </div>
    </form>

    <div class="row mt-3">
        <div class="col-6">
            <ul th:if="${error != null}" class="alert alert-danger">
                <li th:text="${error}"></li>
            </ul>
        </div>
    </div>

</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
