<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head(titulo='Equipos')"></head>

<body>

<div class="container-fluid">
    <div th:replace="fragments :: menu"></div>

    <div class="row mt-3">
        <div class="col">
            <h2>Equipos</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">

            <table class="table table-striped">

                <thead>
                <tr>
                    <th>Identificador</th>
                    <th>Nombre</th>
                    <th>Miembros</th>
                    <th>Participación</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="equipo : ${equipos}">

                    <td th:text="${equipo.id}"></td>

                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}"
                           th:text="${equipo.nombre}">
                            Nombre del equipo
                        </a>
                    </td>

                    <td>
                        <a class="btn btn-primary btn-xs"
                           th:href="@{/equipos/{id}(id=${equipo.id})}">
                            Ver miembros
                        </a>
                    </td>

                    <td>
                        <!-- so esta ya en el equipo se le muestra el boton de salir -->
                        <form th:if="${#lists.contains(idsEquiposUsuario, equipo.id)}"
                              th:action="@{/equipos/{id}/salir(id=${equipo.id})}"
                              method="post">
                            <button type="submit" class="btn btn-danger btn-xs">
                                Salir del equipo
                            </button>
                        </form>

                        <!-- si no esta se le muestra el de unirse -->
                        <form th:unless="${#lists.contains(idsEquiposUsuario, equipo.id)}"
                              th:action="@{/equipos/{id}/unirse(id=${equipo.id})}"
                              method="post">
                            <button type="submit" class="btn btn-success btn-xs">
                                Unirme
                            </button>
                        </form>
                    </td>

                </tr>

                </tbody>

            </table>

            <p th:if="${#lists.isEmpty(equipos)}">
                No hay equipos dados de alta.
            </p>

            <p>
                <a class="btn btn-primary" th:href="@{/equipos/nueva}">Nuevo equipo</a>
            </p>

        </div>
    </div>

    <div class="row mt-2">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert"
                 th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="alert alert-danger alert-dismissible fade show" role="alert"
                 th:if="${!#strings.isEmpty(error)}">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>

</div>

<div th:replace="fragments::javascript"></div>

</body>
</html>
